[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-seat-reconciler"
version = "0.1.0"
description = "Reconcile paid, assigned and used software seats across centres and products, and forecast next quarter under two options."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["reconciler"]

[tool.setuptools.package-data]
reconciler = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
